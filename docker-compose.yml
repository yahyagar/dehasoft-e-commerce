services:
  postgres:
    image: postgres:16-alpine
    container_name: dehacommerce-postgres
    environment:
      POSTGRES_DB: dehacommerce
      POSTGRES_USER: dehacommerce
      POSTGRES_PASSWORD: dehacommerce
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dehacommerce -d dehacommerce"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./e-commerce-api
    container_name: dehacommerce-api
    environment:
      APP_NAME: DehaCommerce
      APP_ENV: local
      APP_KEY: base64:L2ShuKHz5/9+TYKyIXHiHZcw/2qYdUi5rar7Xz3L07A=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      API_PROXY_SECRET: local-secret-123
      JWT_SECRET: 0625ec66093d687b83d569759204e752f17d206ac6b0f2bc0d00afdbf71fa750
      JWT_TTL: 120
      CURRENCY_API_URL: https://currencyapi.net/api/v2/rates
      CURRENCY_API_KEY: ${CURRENCY_API_KEY:-}
      CURRENCY_API_BASE: USD
      CURRENCY_API_TIMEOUT: 10
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dehacommerce
      DB_USERNAME: dehacommerce
      DB_PASSWORD: dehacommerce
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
    volumes:
      - ./e-commerce-api:/var/www/html
      - api_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: dehacommerce-nginx
    ports:
      - "8000:80"
    volumes:
      - ./e-commerce-api:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  web:
    build:
      context: ./e-commerce-web
    container_name: dehacommerce-web
    environment:
      LARAVEL_API_URL: http://nginx/api
      LARAVEL_PROXY_SECRET: local-secret-123
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./e-commerce-web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      - nginx

volumes:
  postgres_data:
  api_vendor:
  web_node_modules:
  web_next:
